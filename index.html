<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Puisi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: linear-gradient(rgba(165, 124, 70, 0.815), rgba(0, 0, 0, 0.76));
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: white;
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: moveStars linear infinite;
    }

    @keyframes moveStars {
      from { transform: translateY(-10px); }
      to   { transform: translateY(110vh); }
    }

    .lyrics-box {
      position: relative;
      z-index: 1;
      background: rgba(226, 226, 226, 0.678);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.404);
      padding: 30px 40px;
      max-width: 80%;
      text-align: center;
      background-image: url("eb576188-8e54-402d-9f9d-d4048c39c18f.png");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }

    .line {
      opacity: 0;
      font-size: 1.8em;
      animation: fadeIn 2s forwards;
      color: rgba(165, 124, 70, 0.815);
      text-shadow: 2px 2px 4px #b8b8b8;
      margin: 10px 0;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    #playBtn {
      position: relative;
      z-index: 2;
      padding: 10px 20px;
      margin-bottom: 20px;
      border: none;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.2);
      color: rgb(0, 0, 0);
      font-size: 1em;
      cursor: pointer;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      transition: background-color 0.3s;
    }

    #playBtn:hover {
      background-color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="lyrics-box" id="lyrics-box">
    <button id="playBtn">▶play</button>
    <div id="lyrics"></div>
  </div>

  <audio id="bgMusic" src="sound_puisi.mp3" loop></audio>

  <script>
  const lyrics = [
    "jadikan aku rumahmu",
    "pergilah kemanapun dan bersama siapapun yang kamu mau",
    "tapi.. saat kamu merasa perjalananmu sudah selesai",
    "pulanglah..",
    "karena akulah orang itu",
    "orang yang selalu..",
    "bangga memilikimu"
  ];

  const customDelays = [0, 2000, 5000, 8000, 11000, 12000, 14000];

  const lyricsContainer = document.getElementById("lyrics");

  function showLyricsLoop() {
    lyricsContainer.innerHTML = "";

    lyrics.forEach((line, index) => {
      const lineDiv = document.createElement("div");
      lineDiv.classList.add("line");
      const delaySeconds = customDelays[index] / 1000;
      lineDiv.style.animationDelay = `${delaySeconds}s`;
      lineDiv.textContent = line;
      lyricsContainer.appendChild(lineDiv);
    });

    const totalDuration = customDelays[customDelays.length - 1] + 4000;
    setTimeout(showLyricsLoop, totalDuration); // Ulang animasi
  }

  function generateStars() {
    const starsContainer = document.getElementById("stars");
    for (let i = 0; i < 100; i++) {
      const star = document.createElement("div");
      star.classList.add("star");
      const size = Math.random() * 2 + 1;
      const duration = Math.random() * 10 + 5;
      const left = Math.random() * 100;
      const delay = Math.random() * 10;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${left}%`;
      star.style.top = `-10px`;
      star.style.animationDuration = `${duration}s`;
      star.style.animationDelay = `${delay}s`;
      starsContainer.appendChild(star);
    }
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    const audio = document.getElementById('bgMusic');
    audio.play();
    showLyricsLoop();
    generateStars();
    document.getElementById('playBtn').style.display = 'none';
  });
  </script>

</body>
</html>
