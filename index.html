<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Puisi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: linear-gradient(rgb(0, 0, 0), rgba(0, 0, 0, 0.76));
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: white;
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: moveStars linear infinite;
    }

    @keyframes moveStars {
      from { transform: translateY(-10px); }
      to   { transform: translateY(110vh); }
    }

    .lyrics-box {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      padding: 30px 40px;
      max-width: 80%;
      text-align: center;
      background-image: url("eb576188-8e54-402d-9f9d-d4048c39c18f.png");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }

    .line {
      opacity: 0;
      font-size: 1.8em;
      animation: fadeIn 2s forwards;
      color: #fff;
      text-shadow: 2px 2px 4px #000;
      margin: 10px 0;
    }

    .line.fade-out {
      animation: fadeOut 1s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="lyrics-box" id="lyrics"></div>

  
  <button id="playBtn">▶️ Mainkan Musik</button>
  <audio id="bgMusic" src="sound_puisi.mp3" loop></audio>


  <script>
    const lyrics = [
      "Jadikan aku rumahmu",
      "Pergilah kemanapun dan bersama siapapun yang kamu mau",
      "Tapi.. saat kamu merasa perjalananmu sudah selesai",
      "Pulanglah..",
      "Karena akulah orang itu",
      "Orang yang selalu..",
      "Bangga memilikimu"
    ];

    const customDelays = [0, 2000, 5000, 8000, 11000, 12000, 14000];
    const lyricsContainer = document.getElementById("lyrics");

    function showLyricsLoop() {
      // Kosongkan isi sebelumnya
      lyricsContainer.innerHTML = "";

      lyrics.forEach((line, index) => {
        const lineDiv = document.createElement("div");
        lineDiv.classList.add("line");
        const delaySeconds = customDelays[index] / 1000;
        lineDiv.style.animationDelay = `${delaySeconds}s`;
        lineDiv.textContent = line;
        lyricsContainer.appendChild(lineDiv);

        // Tambahkan efek fade-out setelah 5 detik tampil
        setTimeout(() => {
          lineDiv.classList.add("fade-out");
        }, customDelays[index] + 2000, 5000, 11000, 11000, 12000, 14000);
      });

      // Hitung total durasi looping (durasi baris terakhir + fade-out)
      const totalDuration = customDelays[customDelays.length - 1] + 7000;
      setTimeout(showLyricsLoop, totalDuration); // loop ulang
    }

    showLyricsLoop(); // jalankan pertama kali

    // Tambahkan bintang
    const starsContainer = document.getElementById("stars");
    for (let i = 0; i < 100; i++) {
      const star = document.createElement("div");
      star.classList.add("star");
      const size = Math.random() * 2 + 1;
      const duration = Math.random() * 10 + 5;
      const left = Math.random() * 100;
      const delay = Math.random() * 10;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${left}%`;
      star.style.top = `-10px`;
      star.style.animationDuration = `${duration}s`;
      star.style.animationDelay = `${delay}s`;
      starsContainer.appendChild(star);
    }


    document.getElementById('playBtn').addEventListener('click', () => {
      const audio = document.getElementById('bgMusic');
      audio.play();
    });

    
  </script>
</body>
</html>
